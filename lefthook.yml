pre-commit:
  parallel: true
  commands:
    fmt:
      # Let rs fmt select supported staged files using the root configuration.
      # Ignored-only and unsupported-only changes must not block commits.
      stage_fixed: true
      run: pnpm exec rs fmt --ignore-unknown --no-error-on-unmatched-pattern {staged_files}

pre-push:
  # The build generates and formats LICENSE.md before the repository-wide
  # formatting check reads it.
  parallel: false
  commands:
    # Type-check needs built package .d.ts, so build first. Runs unless the push
    # is entirely markdown, so a docs-only push still skips the build while config
    # inputs (tsconfig.json, rstack.config.mts, ...) keep gating it. An inclusive
    # extension glob would miss those: lefthook's **/*.x does not match repo-root
    # files such as rstack.config.mts.
    typecheck:
      priority: 1
      exclude:
        - '*.md'
        - '*.mdx'
      run: pnpm run build && pnpm run lint:type
    # Also run on docs-only pushes, which skip the build above.
    format-spell:
      priority: 2
      run: pnpm exec rs fmt --check && pnpm run check-spell
    # Dependency-version check lives here rather than on pre-commit; lefthook skips
    # it instantly when no pushed file matches its glob, so a code-only push pays
    # nothing.
    check-dependency-version:
      priority: 3
      glob: '**/package.json'
      run: pnpm run check-dependency-version
