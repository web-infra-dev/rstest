name: Test

on:
  pull_request:
    branches: [main]
    # Include `labeled` so applying `ci:macos` to an open PR (or via `gh pr
    # create --label`) immediately schedules the expanded macOS e2e matrix.
    types: [opened, synchronize, reopened, labeled]

  push:
    branches: [main]

  schedule:
    # Daily full 4x4 e2e sweep on main (02:00 UTC+8) to catch rare
    # OS x secondary-mode regressions without slowing every main push.
    - cron: '0 18 * * *'

  workflow_dispatch:
    inputs:
      fullRun:
        description: 'Run the full e2e matrix'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

env:
  # Configure Node.js memory limit to 6GB (default GitHub Actions limit is 7GB)
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ github.event_name == 'schedule' && (steps.nightly.outputs.should_skip != 'true' && 'true' || 'false') || steps.changes.outputs.changed }}
      # 4-leg matrix (macos/24, windows/24, ubuntu/20, ubuntu/26): push to main, nightly, release PR, or manual fullRun.
      is_full_matrix: ${{ github.event_name == 'push' || github.event_name == 'schedule' || startsWith(github.event.pull_request.title, 'release:') || inputs.fullRun }}
      # Full 4x4 sweep (all 4 e2e scripts on all 4 legs): nightly, release PR, or manual fullRun.
      # Regular main pushes run secondary modes (commonjs/no-isolate/threads) on ubuntu legs only.
      is_full_modes: ${{ github.event_name == 'schedule' || startsWith(github.event.pull_request.title, 'release:') || inputs.fullRun }}
      # Opt-in macOS e2e leg on regular PRs via the `ci:macos` label.
      run_macos: ${{ contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
    steps:
      - name: Check duplicate nightly run
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?event=schedule&head_sha=${{ github.sha }}&status=success&per_page=1" \
            --jq '.total_count')
          if [ "$count" -gt 0 ]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping nightly: commit ${{ github.sha }} already passed a scheduled run."
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: github.event_name != 'schedule'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule'
        id: changes
        with:
          predicate-quantifier: 'every'
          filters: |
            changed:
              - "!**/*.md"
              - "!**/*.mdx"
              - "!**/_meta.json"
              - "!**/dictionary.txt"
              - "!website/**"
              - "!benchmarks/**"

  # ======== lint ========
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Build Packages
        run: pnpm run build
        env:
          # Publish checks are comparatively expensive and only need to run once
          # as part of the lint/static-check gate.
          RSTEST_PUBLISH_CHECK: true

      - name: Lint
        run: pnpm run lint

      - name: Check Dependency Version
        run: pnpm run check-dependency-version

      - name: Check Version Consistency
        run: pnpm run check-version-consistency

      - name: Check Unused Code
        run: pnpm run check-unused

      - name: Check pnpm Dedupe
        # Keep dedupe last: `pnpm dedupe --check` may leave pnpm's modules
        # state needing a reconcile. If another `pnpm run ...` follows it,
        # pnpm can enter its implicit install path and rerun lifecycle scripts
        # such as the root `prepare`.
        run: pnpm dedupe --check --config.minimum-release-age=0

  # ======== ut ========
  ut:
    # Runs in parallel with lint on ubuntu (the cheapest, most plentiful runner
    # in the org pool) so passing PRs do not serialize ut behind lint. Heavy e2e
    # jobs stay gated behind both lint and ut.
    #
    # ut is OS-agnostic by convention; OS-specific behavior is covered by the
    # e2e job's cross-OS rows instead.
    needs: [prepare]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Packages
        run: pnpm run build

      - name: Run Test
        run: pnpm run test

      - name: Run Examples Test
        run: pnpm run test:examples

      - name: Run Federation Example Test
        run: pnpm run test:federation

  # ======== e2e ========
  e2e:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    env:
      RSTEST_E2E_RUN_FIREFOX: 'true'
    # Full runs execute all four e2e scripts sequentially. macOS can spend
    # over 60 minutes across successful steps, so allow room for the whole
    # matrix without changing individual test or teardown deadlines.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Sparse matrix (include-only), not an os × node cross-product:
        #   - Regular PRs run ubuntu/24 and windows/24 to keep PR latency low
        #     and avoid saturating the org's scarce macOS concurrency pool.
        #     Add the `ci:macos` label to a PR to opt into macos/24 pre-merge.
        #   - Push to main runs all 4 legs on default `test`, and scopes the
        #     OS-agnostic secondary modes (commonjs, no-isolate, threads) to
        #     ubuntu/20 and ubuntu/26 so macOS/Windows stay fast.
        #   - Nightly schedule, release PRs, and manual fullRun run all 4 legs
        #     × all 4 scripts.
        #
        #   trigger         | combos                           | scripts run as steps
        #   ----------------+----------------------------------+-------------------------------------------
        #   PR (regular)    | ubuntu/24, windows/24            | test
        #   PR (`ci:macos`) | + macos/24                       | test
        #   push to main    | macos/24, windows/24, ubu/20, 26 | test (all 4); cjs/no-iso/threads (ubuntu)
        #   nightly/release | macos/24, windows/24, ubu/20, 26 | test, commonjs, no-isolate, threads (all 4)
        #
        # The e2e scripts (test, test:commonjs, test:no-isolate, test:threads)
        # are sequential steps of one job, not a matrix axis: they share the
        # same ~2 min checkout/install/build setup, and collapsing them keeps
        # the job count down so a burst of merges does not starve the org-wide
        # runner pool.
        #
        # Node 20 + test:no-isolate can hit upstream vm native crashes under worker
        # reuse; tolerated on full runs in exchange for coverage.
        # Node 26 covers the current line, where Web Storage is enabled by default
        # and `localStorage` exists on globalThis before a DOM environment is set up.
        include: >-
          ${{ fromJson(
            needs.prepare.outputs.is_full_matrix == 'true'
              && '[{"os":"macos-latest","node_version":"24"},{"os":"windows-latest","node_version":"24"},{"os":"ubuntu-latest","node_version":"20"},{"os":"ubuntu-latest","node_version":"26"}]'
            || (needs.prepare.outputs.run_macos == 'true'
              && '[{"os":"ubuntu-latest","node_version":"24"},{"os":"windows-latest","node_version":"24"},{"os":"macos-latest","node_version":"24"}]'
              || '[{"os":"ubuntu-latest","node_version":"24"},{"os":"windows-latest","node_version":"24"}]')
          ) }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup pnpm standalone
        if: matrix.node_version == '20'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # pnpm 11 requires Node >=22, but this matrix intentionally tests Node 20 runtime behavior.
          standalone: true

      - name: Setup pnpm
        if: matrix.node_version != '20'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node_version }}
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Packages
        id: build
        run: pnpm run build

      - name: Setup Playwright
        # Every job runs the `test` script, which includes browser-mode e2e
        # (incl. the WebKit fixture), so browsers are always needed.
        uses: ./.github/actions/setup-playwright
        with:
          install-webkit: 'true'
          install-firefox: 'true'

      - name: E2E Test (test)
        run: cd e2e && pnpm test

      # Each remaining script is gated on the build having succeeded but NOT on
      # the previous scripts, so one failing script does not mask the others'
      # results — they were independent matrix jobs before being collapsed into
      # steps.
      - name: E2E Test (test:commonjs)
        if: ${{ (needs.prepare.outputs.is_full_modes == 'true' || (needs.prepare.outputs.is_full_matrix == 'true' && matrix.os == 'ubuntu-latest')) && !cancelled() && steps.build.outcome == 'success' }}
        # Playwright keeps default-mode coverage on every OS/Node combination;
        # CommonJS only needs one extra pass, on the oldest supported Node.
        run: cd e2e && pnpm test:commonjs
        env:
          RSTEST_E2E_SKIP_PLAYWRIGHT: ${{ matrix.os != 'ubuntu-latest' || matrix.node_version != '20' }}

      # Playwright fixtures already use isolate:false and explicitly cover pools.
      # These outer-runner modes do not add fixture coverage.
      - name: E2E Test (test:no-isolate)
        if: ${{ (needs.prepare.outputs.is_full_modes == 'true' || (needs.prepare.outputs.is_full_matrix == 'true' && matrix.os == 'ubuntu-latest')) && !cancelled() && steps.build.outcome == 'success' }}
        run: cd e2e && pnpm test:no-isolate
        env:
          RSTEST_E2E_SKIP_PLAYWRIGHT: 'true'

      - name: E2E Test (test:threads)
        if: ${{ (needs.prepare.outputs.is_full_modes == 'true' || (needs.prepare.outputs.is_full_matrix == 'true' && matrix.os == 'ubuntu-latest')) && !cancelled() && steps.build.outcome == 'success' }}
        run: cd e2e && pnpm test:threads
        env:
          RSTEST_E2E_SKIP_PLAYWRIGHT: 'true'

  # ======== codspeed ========
  # Temporarily disabled: CodSpeed runner quota exhausted.
  # Re-enable once quota resets.
  codspeed:
    needs: e2e
    if: false
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/codspeed.yml
    with:
      ref: ${{ github.sha }}

  # ======== gate ========
  test-gate:
    needs: [prepare, lint, ut, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test requirement
        run: |
          for result in \
            "${{ needs.prepare.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.ut.result }}" \
            "${{ needs.e2e.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done

  # ======== nightly-report ========
  nightly-report:
    needs: [prepare, lint, ut, e2e]
    if: always() && github.event_name == 'schedule' && github.repository == 'web-infra-dev/rstest' && (needs.prepare.result != 'success' || needs.prepare.outputs.changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report nightly status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          UT_RESULT: ${{ needs.ut.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        with:
          script: |
            const TITLE = 'Nightly E2E CI failed';
            const results = {
              prepare: process.env.PREPARE_RESULT,
              lint: process.env.LINT_RESULT,
              ut: process.env.UT_RESULT,
              e2e: process.env.E2E_RESULT,
            };
            const failed = Object.values(results).some(
              (r) => r === 'failure' || r === 'cancelled',
            );
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${context.sha}`;
            const shortSha = context.sha.slice(0, 7);

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 50,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === TITLE,
            );

            if (failed) {
              const summary = Object.entries(results)
                .map(([name, result]) => `- \`${name}\`: ${result}`)
                .join('\n');
              const body = [
                `Nightly full 4x4 CI failed on [\`${shortSha}\`](${commitUrl}).`,
                '',
                `- Workflow run: ${runUrl}`,
                summary,
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: TITLE,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Nightly full 4x4 CI recovered on [\`${shortSha}\`](${commitUrl}) (${runUrl}). Closing this issue.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
