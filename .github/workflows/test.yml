name: Test

on:
  pull_request:
    branches: [main]
    # Include `labeled` so applying `ci:macos` to an open PR (or via `gh pr
    # create --label`) immediately schedules the expanded macOS e2e matrix.
    types: [opened, synchronize, reopened, labeled]

  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      fullRun:
        description: 'Run the full e2e matrix'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

env:
  # Configure Node.js memory limit to 6GB (default GitHub Actions limit is 7GB)
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      # Full e2e sweep: push to main (post-merge gate) or release PR (pre-publish gate)
      is_full_run: ${{ github.event_name == 'push' || startsWith(github.event.pull_request.title, 'release:') || inputs.fullRun }}
      # Opt-in macOS e2e leg on regular PRs via the `ci:macos` label.
      run_macos: ${{ contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          predicate-quantifier: 'every'
          filters: |
            changed:
              - "!**/*.md"
              - "!**/*.mdx"
              - "!**/_meta.json"
              - "!**/dictionary.txt"
              - "!website/**"

  # ======== lint ========
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Build Packages
        run: pnpm run build
        env:
          # Publish checks are comparatively expensive and only need to run once
          # as part of the lint/static-check gate.
          RSTEST_PUBLISH_CHECK: true

      - name: Lint
        run: pnpm run lint

      - name: Check Dependency Version
        run: pnpm run check-dependency-version

      - name: Check Version Consistency
        run: pnpm run check-version-consistency

      - name: Check Unused Code
        run: pnpm run check-unused

      - name: Check pnpm Dedupe
        # Keep dedupe last: `pnpm dedupe --check` may leave pnpm's modules
        # state needing a reconcile. If another `pnpm run ...` follows it,
        # pnpm can enter its implicit install path and rerun lifecycle scripts
        # such as the root `prepare`.
        run: pnpm dedupe --check --config.minimum-release-age=0

  # ======== ut ========
  ut:
    # Runs in parallel with lint on ubuntu (the cheapest, most plentiful runner
    # in the org pool) so passing PRs do not serialize ut behind lint. Heavy e2e
    # jobs stay gated behind both lint and ut.
    #
    # ut is OS-agnostic by convention; OS-specific behavior is covered by the
    # e2e job's cross-OS rows instead.
    needs: [prepare]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Packages
        run: pnpm run build

      - name: Run Test
        run: pnpm run test

      - name: Run Examples Test
        run: pnpm run test:examples

      - name: Run Federation Example Test
        run: pnpm run test:federation

  # ======== e2e ========
  # Static top-level jobs instead of a dynamic matrix so every leg always emits
  # a check-run (either executed or `skipped`, consuming zero runner slots).
  # GitHub rulesets treat `skipped` required checks as passing and enforce
  # `success` whenever a leg actually runs — allowing rulesets to require each
  # static job directly without a trailing `test-gate` job queuing for a runner.
  #
  #   trigger         | active jobs                                             | scripts run as steps
  #   ----------------+---------------------------------------------------------+------------------------------
  #   PR (regular)    | e2e-ubuntu-24, e2e-windows-24                           | test
  #   PR (`ci:macos`) | + e2e-macos-24                                          | test
  #   push to main    | e2e-macos-24, e2e-windows-24, e2e-ubuntu-20, -ubuntu-26 | test, commonjs, no-isolate, threads
  #   release PR      | e2e-macos-24, e2e-windows-24, e2e-ubuntu-20, -ubuntu-26 | test, commonjs, no-isolate, threads
  #
  # Full runs execute all four e2e scripts sequentially in one job so they share
  # checkout/install/build setup and avoid starving the org-wide runner pool.
  # macOS full runs can exceed 60 minutes, so keep timeout-minutes at 90.
  #
  # Node 20 + test:no-isolate can hit upstream vm native crashes under worker
  # reuse; tolerated on full runs in exchange for coverage.
  # Node 26 covers the current line, where Web Storage is enabled by default
  # and `localStorage` exists on globalThis before a DOM environment is set up.
  e2e-ubuntu-24:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.is_full_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '24'
          is-full-run: ${{ needs.prepare.outputs.is_full_run }}

  e2e-windows-24:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '24'
          is-full-run: ${{ needs.prepare.outputs.is_full_run }}

  e2e-macos-24:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true' && (needs.prepare.outputs.is_full_run == 'true' || needs.prepare.outputs.run_macos == 'true')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '24'
          is-full-run: ${{ needs.prepare.outputs.is_full_run }}

  e2e-ubuntu-20:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.is_full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '20'
          is-full-run: ${{ needs.prepare.outputs.is_full_run }}
          run-commonjs-playwright: 'true'

  e2e-ubuntu-26:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.is_full_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '26'
          is-full-run: ${{ needs.prepare.outputs.is_full_run }}

  # ======== codspeed ========
  # Temporarily disabled: CodSpeed runner quota exhausted.
  # Re-enable once quota resets.
  codspeed:
    needs:
      - e2e-ubuntu-24
      - e2e-windows-24
      - e2e-macos-24
      - e2e-ubuntu-20
      - e2e-ubuntu-26
    if: false
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/codspeed.yml
    with:
      ref: ${{ github.sha }}
