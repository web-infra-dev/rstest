name: Test

on:
  pull_request:
    branches: [main]
    # Include `labeled` so applying `ci:macos` to an open PR (or via `gh pr
    # create --label`) immediately schedules the expanded macOS e2e matrix.
    types: [opened, synchronize, reopened, labeled]

  push:
    branches: [main]

  schedule:
    # Daily full 4x4 e2e sweep on main (02:00 UTC+8) to catch rare
    # OS x secondary-mode regressions without slowing every main push.
    - cron: '0 18 * * *'

  workflow_dispatch:
    inputs:
      fullRun:
        description: 'Run the full e2e matrix'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

env:
  # Configure Node.js memory limit to 6GB (default GitHub Actions limit is 7GB)
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ github.event_name == 'schedule' && (steps.nightly.outputs.should_skip != 'true' && 'true' || 'false') || steps.changes.outputs.changed }}
      # 4-leg matrix (macos/24, windows/24, ubuntu/20, ubuntu/26): push to main, nightly, release PR, or manual fullRun.
      is_full_matrix: ${{ github.event_name == 'push' || github.event_name == 'schedule' || startsWith(github.event.pull_request.title, 'release:') || inputs.fullRun }}
      # Full 4x4 sweep (all 4 e2e scripts on all 4 legs): nightly, release PR, or manual fullRun.
      # Regular main pushes run secondary modes (commonjs/no-isolate/threads) on ubuntu legs only.
      is_full_modes: ${{ github.event_name == 'schedule' || startsWith(github.event.pull_request.title, 'release:') || inputs.fullRun }}
      # Opt-in macOS e2e leg on regular PRs via the `ci:macos` label.
      run_macos: ${{ contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
    steps:
      - name: Check duplicate nightly run
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test.yml/runs?event=schedule&head_sha=${{ github.sha }}&status=success&per_page=1" \
            --jq '.total_count')
          if [ "$count" -gt 0 ]; then
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping nightly: commit ${{ github.sha }} already passed a scheduled run."
          else
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: github.event_name != 'schedule'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'schedule'
        id: changes
        with:
          predicate-quantifier: 'every'
          filters: |
            changed:
              - "!**/*.md"
              - "!**/*.mdx"
              - "!**/_meta.json"
              - "!**/dictionary.txt"
              - "!website/**"
              - "!benchmarks/**"

  # ======== lint ========
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --ignore-scripts

      - name: Build Packages
        run: pnpm run build
        env:
          # Publish checks are comparatively expensive and only need to run once
          # as part of the lint/static-check gate.
          RSTEST_PUBLISH_CHECK: true

      - name: Lint
        run: pnpm run lint

      - name: Check Dependency Version
        run: pnpm run check-dependency-version

      - name: Check Version Consistency
        run: pnpm run check-version-consistency

      - name: Check Unused Code
        run: pnpm run check-unused

      - name: Check pnpm Dedupe
        # Keep dedupe last: `pnpm dedupe --check` may leave pnpm's modules
        # state needing a reconcile. If another `pnpm run ...` follows it,
        # pnpm can enter its implicit install path and rerun lifecycle scripts
        # such as the root `prepare`.
        run: pnpm dedupe --check --config.minimum-release-age=0

  # ======== ut ========
  ut:
    # Runs in parallel with lint on ubuntu (the cheapest, most plentiful runner
    # in the org pool) so passing PRs do not serialize ut behind lint. Heavy e2e
    # jobs stay gated behind both lint and ut.
    #
    # ut is OS-agnostic by convention; OS-specific behavior is covered by the
    # e2e job's cross-OS rows instead.
    needs: [prepare]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Packages
        run: pnpm run build

      - name: Run Test
        run: pnpm run test

      - name: Run Examples Test
        run: pnpm run test:examples

      - name: Run Federation Example Test
        run: pnpm run test:federation

  # ======== e2e ========
  # Static top-level jobs instead of a dynamic matrix so every leg always emits
  # a check-run (either executed or `skipped`, consuming zero runner slots).
  # GitHub rulesets treat `skipped` required checks as passing and enforce
  # `success` whenever a leg actually runs — allowing rulesets to require each
  # static job directly without a trailing `test-gate` job queuing for a runner.
  #
  #   trigger         | active jobs                                             | scripts run as steps
  #   ----------------+---------------------------------------------------------+-------------------------------------------
  #   PR (regular)    | e2e-ubuntu-24, e2e-windows-24                           | test
  #   PR (`ci:macos`) | + e2e-macos-24                                          | test
  #   push to main    | e2e-macos-24, e2e-windows-24, e2e-ubuntu-20, -ubuntu-26 | test (all 4); cjs/no-iso/threads (ubuntu)
  #   nightly/release | e2e-macos-24, e2e-windows-24, e2e-ubuntu-20, -ubuntu-26 | test, commonjs, no-isolate, threads (all 4)
  #
  # Full runs execute all four e2e scripts sequentially in one job so they share
  # checkout/install/build setup and avoid starving the org-wide runner pool.
  # macOS full runs can exceed 60 minutes, so keep timeout-minutes at 90.
  #
  # Node 20 + test:no-isolate can hit upstream vm native crashes under worker
  # reuse; tolerated on full runs in exchange for coverage.
  # Node 26 covers the current line, where Web Storage is enabled by default
  # and `localStorage` exists on globalThis before a DOM environment is set up.
  e2e-ubuntu-24:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.is_full_matrix != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '24'

  e2e-windows-24:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '24'
          run-secondary-modes: ${{ needs.prepare.outputs.is_full_modes }}

  e2e-macos-24:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true' && (needs.prepare.outputs.is_full_matrix == 'true' || needs.prepare.outputs.run_macos == 'true')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '24'
          run-secondary-modes: ${{ needs.prepare.outputs.is_full_modes }}

  e2e-ubuntu-20:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.is_full_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '20'
          run-secondary-modes: 'true'
          run-commonjs-playwright: 'true'

  e2e-ubuntu-26:
    needs: [prepare, lint, ut]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.is_full_matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Run E2E
        uses: ./.github/actions/run-e2e
        with:
          node-version: '26'
          run-secondary-modes: 'true'

  # ======== codspeed ========
  # Temporarily disabled: CodSpeed runner quota exhausted.
  # Re-enable once quota resets.
  codspeed:
    needs:
      - e2e-ubuntu-24
      - e2e-windows-24
      - e2e-macos-24
      - e2e-ubuntu-20
      - e2e-ubuntu-26
    if: false
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/codspeed.yml
    with:
      ref: ${{ github.sha }}

  # ======== nightly-report ========
  nightly-report:
    needs:
      - prepare
      - lint
      - ut
      - e2e-ubuntu-24
      - e2e-windows-24
      - e2e-macos-24
      - e2e-ubuntu-20
      - e2e-ubuntu-26
    if: always() && github.event_name == 'schedule' && github.repository == 'web-infra-dev/rstest' && (needs.prepare.result != 'success' || needs.prepare.outputs.changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Report nightly status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          UT_RESULT: ${{ needs.ut.result }}
          E2E_UBUNTU_24_RESULT: ${{ needs.e2e-ubuntu-24.result }}
          E2E_WINDOWS_24_RESULT: ${{ needs.e2e-windows-24.result }}
          E2E_MACOS_24_RESULT: ${{ needs.e2e-macos-24.result }}
          E2E_UBUNTU_20_RESULT: ${{ needs.e2e-ubuntu-20.result }}
          E2E_UBUNTU_26_RESULT: ${{ needs.e2e-ubuntu-26.result }}
        with:
          script: |
            const TITLE = 'Nightly E2E CI failed';
            const results = {
              prepare: process.env.PREPARE_RESULT,
              lint: process.env.LINT_RESULT,
              ut: process.env.UT_RESULT,
              'e2e-ubuntu-24': process.env.E2E_UBUNTU_24_RESULT,
              'e2e-windows-24': process.env.E2E_WINDOWS_24_RESULT,
              'e2e-macos-24': process.env.E2E_MACOS_24_RESULT,
              'e2e-ubuntu-20': process.env.E2E_UBUNTU_20_RESULT,
              'e2e-ubuntu-26': process.env.E2E_UBUNTU_26_RESULT,
            };
            const failed = Object.values(results).some(
              (r) => r === 'failure' || r === 'cancelled',
            );
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            const commitUrl = `${context.serverUrl}/${owner}/${repo}/commit/${context.sha}`;
            const shortSha = context.sha.slice(0, 7);

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              creator: 'github-actions[bot]',
              per_page: 50,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title === TITLE,
            );

            if (failed) {
              const failedLines = [];
              try {
                const { data: jobsData } =
                  await github.rest.actions.listJobsForWorkflowRun({
                    owner,
                    repo,
                    run_id: runId,
                    per_page: 100,
                  });
                for (const job of jobsData.jobs) {
                  if (
                    job.conclusion === 'failure' ||
                    job.conclusion === 'cancelled' ||
                    job.conclusion === 'timed_out'
                  ) {
                    const failedSteps = (job.steps ?? [])
                      .filter(
                        (s) =>
                          s.conclusion === 'failure' ||
                          s.conclusion === 'cancelled' ||
                          s.conclusion === 'timed_out',
                      )
                      .map((s) => `\`${s.name}\``);
                    const stepInfo =
                      failedSteps.length > 0
                        ? ` — steps: ${failedSteps.join(', ')}`
                        : '';
                    failedLines.push(
                      `- [\`${job.name}\`](${job.html_url}) (${job.conclusion})${stepInfo} — \`gh run view ${runId} --repo ${owner}/${repo} --job ${job.id} --log-failed\``,
                    );
                  }
                }
              } catch (err) {
                core.warning(`Failed to list workflow jobs: ${err.message}`);
              }

              if (failedLines.length === 0) {
                for (const [name, result] of Object.entries(results)) {
                  if (result === 'failure' || result === 'cancelled') {
                    failedLines.push(`- \`${name}\`: ${result}`);
                  }
                }
              }

              const logCmd = `gh run view ${runId} --repo ${owner}/${repo} --log-failed`;
              const failedSection = [
                '### Failed jobs',
                ...failedLines,
              ].join('\n');

              if (existing) {
                const commentBody = [
                  `Still failing on [\`${shortSha}\`](${commitUrl}) (run [#${runId}](${runUrl})).`,
                  '',
                  failedSection,
                  '',
                  `Logs: \`${logCmd}\``,
                ].join('\n');
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: commentBody,
                });
              } else {
                const issueBody = [
                  `Nightly full 4x4 E2E CI failed on [\`${shortSha}\`](${commitUrl}) (run [#${runId}](${runUrl})).`,
                  '',
                  failedSection,
                  '',
                  '### For agent',
                  `1. Inspect failure logs with \`${logCmd}\` (or the job-specific command above).`,
                  '2. Determine whether this is a real regression (note: `macos-latest` and `windows-latest` only run secondary e2e modes `test:commonjs`, `test:no-isolate`, and `test:threads` on nightly/release runs) or a flake/timeout.',
                  '3. Identify the causing commit on `main`, reproduce and fix the root cause with tests, and open a PR.',
                ].join('\n');
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: TITLE,
                  body: issueBody,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Nightly full 4x4 CI recovered on [\`${shortSha}\`](${commitUrl}) (run [#${runId}](${runUrl})). Closing this issue.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
