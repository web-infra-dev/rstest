name: Test Rspack Preview

on:
  push:
    branches: [9aoy/fix-import-meta-resolve]

permissions:
  contents: read

concurrency:
  group: rspack-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      RSPACK_CORE_PREVIEW: 'https://pkg.pr.new/web-infra-dev/rspack/@rspack/core@88760e3'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          package-manager-cache: false

      # This preview contains only a Linux binding. Keep the override local to
      # this job so macOS and Windows CI continue using the published packages.
      - name: Select Rspack preview
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          appendFileSync('pnpm-workspace.yaml', `\noverrides:\n  '@rspack/core': '${process.env.RSPACK_CORE_PREVIEW}'\n`);
          console.log(`Rspack preview: ${process.env.RSPACK_CORE_PREVIEW}`);
          JS

      - name: Install dependencies with preview override
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        id: build
        run: pnpm build

      - name: Check types
        run: pnpm typecheck

      - name: Check unused code
        run: pnpm check-unused

      - name: Run unit tests
        run: pnpm test

      - name: Run resolution e2e (ESM)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: e2e
        run: pnpm test externals/importMetaResolve.test.ts externals/requireResolveOrigin.test.ts externals/dynamicImportRelative.test.ts externals/dynamicImportInterop.test.ts

      - name: Run resolution e2e (CommonJS)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: e2e
        env:
          RSTEST_OUTPUT_MODULE: 'false'
        run: pnpm test externals/importMetaResolve.test.ts externals/requireResolveOrigin.test.ts externals/dynamicImportRelative.test.ts externals/dynamicImportInterop.test.ts

      - name: Run resolution e2e (threads)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: e2e
        run: pnpm test externals/importMetaResolve.test.ts externals/requireResolveOrigin.test.ts --pool.type threads

      - name: Run resolution e2e (no isolation)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: e2e
        run: pnpm test externals/importMetaResolve.test.ts externals/requireResolveOrigin.test.ts --isolate false
