name: CodSpeed

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to benchmark.'
        required: false
        type: string
  schedule:
    # Run daily on main to build a continuous baseline for memory benchmark
    - cron: '0 20 * * *'
    # Run once a week on main to build a continuous baseline for CPU benchmark
    - cron: '0 0 * * 0'
  # Allow manual runs on any branch (CodSpeed backtest + on-demand profiling)
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to benchmark (branch, tag, or SHA). Defaults to the selected branch.'
        required: false
        type: string
      suite:
        description: 'Which benchmark suite to run.'
        required: false
        type: choice
        default: all
        options:
          - all
          - cpu
          - memory

concurrency:
  group: codspeed-${{ github.event.pull_request.number || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  # Skip benchmark jobs that have already succeeded on the current HEAD
  # (e.g. a schedule run fires but no new commits landed since the last run).
  # Tracked per job so a daily memory run does not skip the weekly CPU run.
  check-skip:
    name: Check duplicate run
    runs-on: ubuntu-latest
    outputs:
      skip_cpu: ${{ steps.check.outputs.skip_cpu }}
      skip_memory: ${{ steps.check.outputs.skip_memory }}
    steps:
      - name: Check for existing successful run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always run when manually triggered
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip_cpu=false" >> "$GITHUB_OUTPUT"
            echo "skip_memory=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          skip_cpu=false
          skip_memory=false
          # Query completed runs of this workflow for the current commit
          run_ids=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/codspeed.yml/runs?head_sha=${{ github.sha }}&status=completed&per_page=20" \
            --jq '.workflow_runs[].id')
          for run_id in $run_ids; do
            jobs=$(gh api \
              "repos/${{ github.repository }}/actions/runs/${run_id}/jobs" \
              --jq '.jobs[] | select(.conclusion == "success") | .name')
            if printf '%s\n' "$jobs" | grep -Fxq "Run CPU benchmarks"; then
              skip_cpu=true
            fi
            if printf '%s\n' "$jobs" | grep -Fxq "Run memory benchmark"; then
              skip_memory=true
            fi
            if [ "$skip_cpu" = "true" ] && [ "$skip_memory" = "true" ]; then
              break
            fi
          done
          echo "skip_cpu=${skip_cpu}" >> "$GITHUB_OUTPUT"
          echo "skip_memory=${skip_memory}" >> "$GITHUB_OUTPUT"
          echo "Duplicate check for ${{ github.sha }}: skip_cpu=${skip_cpu}, skip_memory=${skip_memory}"

  codspeed-cpu:
    name: Run CPU benchmarks
    needs: check-skip
    # CPU walltime benchmark runs on codspeed-macro (expensive), only on weekly schedule or manual trigger
    if: |
      needs.check-skip.outputs.skip_cpu != 'true' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 0 * * 0') || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'cpu' || inputs.suite == '')))
    # Walltime mode requires CodSpeed bare-metal runners for stable measurements.
    # CPU simulation (Valgrind) is incompatible with child_process.fork — rstest's
    # worker pool generates excessive system calls, making flame graphs unavailable.
    runs-on: codspeed-macro
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: walltime
          run: node benchmarks/suiteRun.mjs

  codspeed-memory:
    name: Run memory benchmark
    needs: check-skip
    # Memory benchmark runs daily on main (ubuntu-latest), plus manual trigger or workflow_call
    if: |
      needs.check-skip.outputs.skip_memory != 'true' &&
      ((github.event_name == 'schedule' && github.event.schedule == '0 20 * * *') || github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'memory' || inputs.suite == '')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Run memory benchmark
        uses: CodSpeedHQ/action@f22792bfac16f3e14eb9fbea76f4a48e9cc22b93 # v4.19.1
        with:
          mode: memory
          # Memory mode does not auto-inject V8 flags via introspection
          # (unlike simulation mode), so we pass them explicitly.
          run: >-
            node
            --interpreted-frames-native-stack
            --allow-natives-syntax
            --hash-seed=1
            --random-seed=1
            --no-opt
            --predictable
            --predictable-gc-schedule
            --expose-gc
            --no-concurrent-sweeping
            --max-old-space-size=4096
            benchmarks/memorySuiteRun.mjs
