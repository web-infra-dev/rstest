name: Bundle Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'

  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  bundle-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build with Rsdoctor
        run: RSDOCTOR_CI=true pnpm --filter "./packages/*" run build
        env:
          CI: true

      - name: Bundle Analysis
        uses: web-infra-dev/rsdoctor-action@d3a7ae073bc63dcc4a16fba339414cbf4f9c476c
        with:
          file_path: 'packages/*/.rsdoctor/**/rsdoctor-data.json'
          target_branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || 'main' }}
