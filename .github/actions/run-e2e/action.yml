name: 'Run E2E'
description: 'Install dependencies, build packages, set up Playwright browsers, and run E2E suites.'

inputs:
  node-version:
    description: 'Node.js major version to set up.'
    required: true
  is-full-run:
    description: 'Run the full set of E2E scripts (test, test:commonjs, test:no-isolate, test:threads).'
    required: false
    default: 'false'
  run-commonjs-playwright:
    description: 'Run Playwright fixtures during test:commonjs instead of skipping them.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm standalone
      if: inputs.node-version == '20'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        # pnpm 11 requires Node >=22, but this leg intentionally tests Node 20 runtime behavior.
        standalone: true

    - name: Setup pnpm
      if: inputs.node-version != '20'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Build Packages
      id: build
      shell: bash
      run: pnpm run build

    - name: Setup Playwright
      # Every leg runs the `test` script, which includes browser-mode e2e
      # (incl. the WebKit fixture), so browsers are always needed.
      uses: ./.github/actions/setup-playwright
      with:
        install-webkit: 'true'
        install-firefox: 'true'

    - name: E2E Test (test)
      shell: bash
      run: cd e2e && pnpm test
      env:
        RSTEST_E2E_RUN_FIREFOX: 'true'

    # Each remaining script is gated on the build having succeeded but NOT on
    # the previous scripts, so one failing script does not mask the others'
    # results — they were independent matrix jobs before being collapsed into
    # steps.
    - name: E2E Test (test:commonjs)
      if: ${{ inputs.is-full-run == 'true' && !cancelled() && steps.build.outcome == 'success' }}
      # Playwright keeps default-mode coverage on every OS/Node combination;
      # CommonJS only needs one extra pass, on the oldest supported Node.
      shell: bash
      run: cd e2e && pnpm test:commonjs
      env:
        RSTEST_E2E_RUN_FIREFOX: 'true'
        RSTEST_E2E_SKIP_PLAYWRIGHT: ${{ inputs.run-commonjs-playwright != 'true' }}

    # Playwright fixtures already use isolate:false and explicitly cover pools.
    # These outer-runner modes do not add fixture coverage.
    - name: E2E Test (test:no-isolate)
      if: ${{ inputs.is-full-run == 'true' && !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: cd e2e && pnpm test:no-isolate
      env:
        RSTEST_E2E_RUN_FIREFOX: 'true'
        RSTEST_E2E_SKIP_PLAYWRIGHT: 'true'

    - name: E2E Test (test:threads)
      if: ${{ inputs.is-full-run == 'true' && !cancelled() && steps.build.outcome == 'success' }}
      shell: bash
      run: cd e2e && pnpm test:threads
      env:
        RSTEST_E2E_RUN_FIREFOX: 'true'
        RSTEST_E2E_SKIP_PLAYWRIGHT: 'true'
