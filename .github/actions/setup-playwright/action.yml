name: 'Setup Playwright'
description: 'Install only Playwright browsers that are not provided by GitHub-hosted runners. Run after dependencies are installed.'

inputs:
  install-webkit:
    description: 'Install Playwright WebKit.'
    required: false
    default: 'false'
  install-firefox:
    description: 'Install Playwright Firefox (bundled build, no channel equivalent).'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Install Playwright WebKit
      if: inputs.install-webkit == 'true'
      shell: bash
      # Only browser-mode e2e includes the explicit WebKit fixture.
      # Linux runners also need WebKit's system libraries (--with-deps);
      # the macOS/Windows images already provide them.
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          npx playwright install --with-deps webkit
        else
          npx playwright install webkit
        fi
    - name: Install Playwright Firefox
      if: inputs.install-firefox == 'true'
      shell: bash
      # The multi-browser fixtures run the bundled Firefox (Playwright offers
      # no system channel for it); Linux runners also need its system
      # libraries.
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          npx playwright install --with-deps firefox
        else
          npx playwright install firefox
        fi
