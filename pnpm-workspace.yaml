packages:
  - 'benchmarks'
  - 'website'
  - 'scripts/**'
  - 'packages/**'
  - 'examples/**'
  - 'e2e/**'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  '@vscode/vsce-sign': false
  core-js-pure: false
  keytar: false
  lefthook: true
  svelte-preprocess: false

autoInstallPeers: false

# for vsce
hoistPattern: ['@secretlint/*']

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@swc-next/parser@0.2.0'
  - '@swc-next/decoder@0.2.0'
  - '@swc-next/parser-binding-darwin-x64@0.2.0'
  - '@swc-next/parser-binding-darwin-arm64@0.2.0'
  - '@swc-next/parser-binding-linux-x64-gnu@0.2.0'
  - '@swc-next/parser-binding-linux-x64-musl@0.2.0'
  - '@swc-next/parser-binding-win32-x64-msvc@0.2.0'
  - '@swc-next/parser-binding-linux-arm64-gnu@0.2.0'
  - '@swc-next/parser-binding-linux-ppc64-gnu@0.2.0'
  - '@swc-next/parser-binding-linux-s390x-gnu@0.2.0'
  - '@swc-next/parser-binding-win32-ia32-msvc@0.2.0'
  - '@swc-next/parser-binding-linux-arm64-musl@0.2.0'
  - '@swc-next/parser-binding-win32-arm64-msvc@0.2.0'
  - '@swc-next/parser-binding-linux-riscv64-gnu@0.2.0'
  - '@swc-next/parser-binding-linux-riscv64-musl@0.2.0'
  - '@module-federation/*'
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
  - '@rstackjs/doc-ui'
  - rsbuild-plugin-dts
  # Renovate security update: svelte@5.55.7
  - svelte@5.55.7

packageExtensions:
  '@vue/test-utils':
    peerDependencies:
      '@vue/compiler-dom': 3.5.17
      '@vue/server-renderer': 3.5.17
      vue: ^3.5.17

patchedDependencies:
  webpack-license-plugin@4.5.1: patches/webpack-license-plugin@4.5.1.patch

# Prevent un-reviewed build scripts
strictDepBuilds: true

strictPeerDependencies: false
