packages:
  - 'benchmarks'
  - 'website'
  - 'scripts/**'
  - 'packages/**'
  - 'examples/**'
  - 'e2e/**'

autoDedupe: true

catalog:
  '@rsbuild/core': ~2.2.13
  '@rsbuild/plugin-babel': ^2.1.0
  '@rsbuild/plugin-less': ^2.0.1
  '@rsbuild/plugin-node-polyfill': ^1.4.6
  '@rsbuild/plugin-react': ^2.1.1
  '@rsbuild/plugin-sass': ^2.0.1
  '@rsbuild/plugin-svelte': ^2.0.1
  '@rsbuild/plugin-svgr': ^2.0.5
  '@rsbuild/plugin-vue': ^2.0.1
  '@rsbuild/plugin-vue-jsx': ^2.0.1
  '@rslib/core': ~1.0.3
  '@rspack/cli': ~2.2.9
  '@rspack/core': ~2.2.9
  '@rspack/dev-server': ~2.2.1
  '@rspack/plugin-react-refresh': ~2.0.2

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js-pure: false
  keytar: false
  lefthook: true
  svelte-preprocess: false

autoInstallPeers: false

# Keep the virtual store free of hoisted packages: pnpm's bin shims put
# node_modules/.pnpm/node_modules on NODE_PATH, so hoisting would make every
# workspace dependency resolvable from any project and defeat install checks
# such as the coverage provider flow. Nothing needs hoisting after the
# standalone extension was removed.
hoist: false

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@module-federation/*'
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rsdoctor/*'
  - '@rslint/*'
  - '@rstackjs/doc-ui'
  - rsbuild-plugin-dts
  # Renovate security update: svelte@5.55.7
  - svelte@5.55.7
  # Renovate security update: happy-dom@21.0.4
  - happy-dom@21.0.4

packageExtensions:
  '@vue/test-utils':
    peerDependencies:
      '@vue/compiler-dom': 3.5.17
      '@vue/server-renderer': 3.5.17
      vue: ^3.5.17

patchedDependencies:
  webpack-license-plugin@4.5.1: patches/webpack-license-plugin@4.5.1.patch

# Prevent un-reviewed build scripts
strictDepBuilds: true

strictPeerDependencies: false
